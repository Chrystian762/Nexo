# Banco local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: nexo-postgres
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    ports:
      - "5432:5432"
    volumes:
      - nexo-dados:/var/lib/postgresql/data

volumes:
  nexo-dados:
