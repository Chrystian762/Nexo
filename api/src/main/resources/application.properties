spring.application.name=nexo-api

# Banco: valores padrão batem com o docker-compose.yml; em produção, usar variáveis de ambiente
spring.datasource.url=${NEXO_DB_URL:jdbc:postgresql://localhost:5432/nexo}
spring.datasource.username=${NEXO_DB_USER:nexo}
spring.datasource.password=${NEXO_DB_PASSWORD:nexo}

# O esquema é criado só pelo Flyway (src/main/resources/db/migration); o Hibernate apenas confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
