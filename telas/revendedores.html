<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revendedores - Nexo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../JS/nexo-tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../JS/nexo-data.js"></script>
    <script src="../JS/nexo-layout.js"></script>
</head>
<body class="bg-brand-bg text-brand-textMain h-screen overflow-hidden flex flex-col md:flex-row font-sans">
    <aside id="nexo-sidebar"></aside>
    <main class="flex-1 relative overflow-y-auto w-full h-full">
        <div class="max-w-[1400px] mx-auto p-4 md:p-8 w-full min-h-full pb-24 fade-in">

            <!-- ============ LISTA ============ -->
            <section id="visao-lista">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-brand-textMain">Revendedores</h1>
                        <p class="text-brand-textMuted mt-1">Dados comerciais, descontos, condições de pagamento e histórico de compras.</p>
                    </div>
                    <button type="button" id="btn-novo" class="nexo-btn nexo-btn-primario"><i class="fa-solid fa-plus"></i> Novo revendedor</button>
                </div>

                <div id="cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6"></div>

                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm">
                    <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 border-b border-gray-100">
                        <div class="relative lg:col-span-2">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                            <input id="filtro-busca" type="search" class="nexo-input !pl-9" placeholder="Buscar por nome, documento ou cidade" aria-label="Buscar revendedor">
                        </div>
                        <select id="filtro-status" class="nexo-input" aria-label="Status">
                            <option value="">Todos os status</option><option>Ativo</option><option>Inativo</option>
                        </select>
                        <select id="filtro-uf" class="nexo-input" aria-label="UF"></select>
                        <button type="button" id="btn-csv" class="nexo-btn nexo-btn-secundario"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
                    </div>
                    <div class="overflow-x-auto"><table class="w-full text-sm min-w-[1100px]">
                        <thead class="text-left text-xs uppercase text-gray-500 bg-gray-50">
                            <tr>
                                <th class="px-4 py-3">Revendedor</th><th class="px-4 py-3">Documento</th><th class="px-4 py-3">Cidade/UF</th>
                                <th class="px-4 py-3 text-right">Desconto</th><th class="px-4 py-3">Pagamento</th>
                                <th class="px-4 py-3 text-right">Limite</th><th class="px-4 py-3 text-right">Clientes</th>
                                <th class="px-4 py-3 text-right">Total comprado</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-corpo" class="divide-y divide-gray-50"></tbody>
                    </table></div>
                    <div id="lista-pag"></div>
                </div>
            </section>

            <!-- ============ DETALHES ============ -->
            <section id="visao-detalhe" class="hidden"></section>
        </div>
    </main>
    <script src="../JS/revendedores.js"></script>
</body>
</html>
