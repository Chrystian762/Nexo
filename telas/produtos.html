<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Nexo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../JS/nexo-tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../JS/nexo-data.js"></script>
    <script src="../JS/nexo-layout.js"></script>
</head>
<body class="bg-brand-bg text-brand-textMain h-screen overflow-hidden flex flex-col md:flex-row font-sans">
    <aside id="nexo-sidebar"></aside>
    <main class="flex-1 relative overflow-y-auto w-full h-full">
        <div class="max-w-[1400px] mx-auto p-4 md:p-8 w-full min-h-full pb-24 fade-in">

            <!-- ============ VIEW: LISTA ============ -->
            <section id="view-lista">
                <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900">Produtos</h1>
                        <p class="text-brand-textMuted mt-1">Cadastro e gerenciamento dos produtos: preço, custo, estoque e status.</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" id="btn-exportar" class="nexo-btn nexo-btn-secundario"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
                        <button type="button" id="btn-categorias" class="nexo-btn nexo-btn-secundario"><i class="fa-solid fa-layer-group"></i> Gerenciar categorias</button>
                        <button type="button" id="btn-novo" class="nexo-btn nexo-btn-primario"><i class="fa-solid fa-plus"></i> Novo produto</button>
                    </div>
                </header>

                <!-- Cards de resumo -->
                <div id="cards-resumo" class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6"></div>

                <!-- Categorias -->
                <div class="mb-6">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">Categorias</h2>
                    <div id="faixa-categorias" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 xl:grid-cols-10 gap-3"></div>
                </div>

                <!-- Busca e filtros -->
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mb-4">
                    <div class="flex flex-col lg:flex-row gap-3">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                            <input type="search" id="busca" class="nexo-input !pl-10" placeholder="Buscar por nome, SKU, código de barras ou marca" aria-label="Buscar produtos">
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <select id="filtro-categoria" class="nexo-input !w-auto" aria-label="Categoria"></select>
                            <select id="filtro-marca" class="nexo-input !w-auto" aria-label="Marca"></select>
                            <select id="filtro-fornecedor" class="nexo-input !w-auto" aria-label="Fornecedor"></select>
                            <select id="filtro-status" class="nexo-input !w-auto" aria-label="Status">
                                <option value="">Todos os status</option>
                                <option value="Ativo">Ativo</option>
                                <option value="Inativo">Inativo</option>
                            </select>
                            <select id="filtro-estoque" class="nexo-input !w-auto" aria-label="Situação do estoque">
                                <option value="">Todo o estoque</option>
                                <option value="Normal">Normal</option>
                                <option value="Estoque baixo">Estoque baixo</option>
                                <option value="Sem estoque">Sem estoque</option>
                            </select>
                            <select id="ordenacao" class="nexo-input !w-auto" aria-label="Ordenação">
                                <option value="nome">Ordenar: Nome (A-Z)</option>
                                <option value="preco-asc">Preço: menor primeiro</option>
                                <option value="preco-desc">Preço: maior primeiro</option>
                                <option value="estoque-asc">Estoque: menor primeiro</option>
                                <option value="estoque-desc">Estoque: maior primeiro</option>
                                <option value="vendidos">Mais vendidos</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-3">
                        <button type="button" id="btn-limpar" class="text-sm font-semibold text-brand-purple hover:underline"><i class="fa-solid fa-filter-circle-xmark mr-1"></i>Limpar filtros</button>
                        <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden" role="group" aria-label="Modo de visualização">
                            <button type="button" id="modo-tabela" class="px-3 py-1.5 text-sm" aria-label="Ver em tabela"><i class="fa-solid fa-table-list"></i></button>
                            <button type="button" id="modo-grade" class="px-3 py-1.5 text-sm border-l border-gray-200" aria-label="Ver em cards"><i class="fa-solid fa-table-cells-large"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Lista -->
                <div id="lista-produtos" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden"></div>
            </section>

            <!-- ============ VIEW: DETALHE ============ -->
            <section id="view-detalhe" class="hidden"></section>

        </div>
    </main>
    <script src="../JS/produtos.js"></script>
</body>
</html>
