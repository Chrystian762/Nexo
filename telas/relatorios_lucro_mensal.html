<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Lucro Mensal - Nexo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../JS/nexo-tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../JS/nexo-data.js"></script>
    <script src="../JS/nexo-layout.js"></script>
</head>
<body class="bg-brand-bg text-brand-textMain h-screen overflow-hidden flex flex-col md:flex-row font-sans">
    <aside id="nexo-sidebar"></aside>
    <main class="flex-1 relative overflow-y-auto w-full h-full">
        <div class="max-w-[1400px] mx-auto p-4 md:p-8 w-full min-h-full pb-24 fade-in">
            <a href="relatorios2.html" class="nao-imprimir inline-flex items-center gap-2 text-sm font-semibold text-gray-500 hover:text-brand-purple transition mb-4">
                <i class="fa-solid fa-arrow-left"></i> Voltar para Relatórios
            </a>

            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-6">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-pink-50 text-pink-500 flex items-center justify-center text-xl shrink-0">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 tracking-tight leading-none mb-1">Relatório de Lucro Mensal</h1>
                        <p id="rel-subtitulo" class="text-sm text-gray-500">Demonstrativo de resultado</p>
                    </div>
                </div>
            <div class="nao-imprimir flex gap-3 w-full md:w-auto">
                <button type="button" id="btn-imprimir" class="flex-1 md:flex-none bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-xl font-semibold transition shadow-sm flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-print"></i> Imprimir / PDF
                </button>
                <button type="button" id="btn-csv" class="flex-1 md:flex-none bg-brand-purple hover:bg-brand-purpleDark text-white px-4 py-2.5 rounded-xl font-semibold transition shadow-sm flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> Exportar CSV
                </button>
            </div>
            </div>

            <div id="rel-impressao" class="so-impressao"></div>
            <div id="rel-filtros"></div>

            <div id="rel-kpis"></div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
                <div class="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-gray-200 p-5 break-inside-avoid lg:col-span-1">
                    <h3 class="text-base font-bold text-gray-900 mb-1">Evolução Financeira</h3>
                    <p id="rel-grafico-sub" class="text-xs text-gray-500 mb-4">Lucro líquido por mês</p>
                    <div class="relative w-full" style="height:300px">
                        <canvas id="lucroChart"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-gray-200 overflow-hidden lg:col-span-2">
                    <div class="p-5 border-b border-gray-100 flex justify-between items-center gap-3 bg-gray-50/50">
                        <div>
                            <h3 id="rel-tabela-titulo" class="text-base font-bold text-gray-900">Demonstrativo Mensal Detalhado</h3>
                            <p class="text-xs text-gray-500 mt-0.5">Faturamento, CMV, despesas pagas, lucro e margem</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span id="rel-tabela-info" class="text-xs font-semibold text-gray-500"></span>
                        </div>
                    </div>
                    <div id="rel-tabela"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="../JS/relatorios-comum.js"></script>
    <script src="../JS/rel-lucro-mensal.js"></script>
</body>
</html>
