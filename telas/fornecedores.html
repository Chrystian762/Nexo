<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores - Nexo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../JS/nexo-tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../JS/nexo-data.js"></script>
    <script src="../JS/nexo-layout.js"></script>
</head>
<body class="bg-brand-bg text-brand-textMain h-screen overflow-hidden flex flex-col md:flex-row font-sans">
    <aside id="nexo-sidebar"></aside>

    <main class="flex-1 relative overflow-y-auto w-full h-full">
        <div class="max-w-[1400px] mx-auto p-4 md:p-8 w-full min-h-full pb-24 fade-in">
            <section class="space-y-6">

                <!-- Título e ações principais -->
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div class="text-left flex-1">
                        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-1">Fornecedores</h1>
                        <p class="text-sm md:text-base text-brand-textMuted">Gerencie e acompanhe os fornecedores da sua empresa.</p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <button type="button" id="btnExportar" class="nexo-btn nexo-btn-secundario"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
                        <button type="button" id="btnCadastrar" class="nexo-btn nexo-btn-primario"><i class="fa-solid fa-plus"></i> Cadastrar Fornecedor</button>
                    </div>
                </div>

                <!-- Filtros -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-brand-border">
                    <div class="flex items-center gap-2 mb-4 text-brand-purple font-bold">
                        <i class="fa-solid fa-filter"></i><span>Filtros</span>
                        <button type="button" id="btnLimpar" class="ml-auto text-xs font-semibold text-brand-purple border border-brand-purple rounded-lg px-3 py-1.5 flex items-center gap-1 hover:bg-brand-purpleLight transition"><i class="fa-solid fa-rotate-right"></i> Limpar Filtros</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="nexo-label" for="fBusca">Buscar fornecedor</label>
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input id="fBusca" type="text" placeholder="Nome, CNPJ, contato ou e-mail" class="nexo-input" style="padding-left:2.25rem">
                            </div>
                        </div>
                        <div>
                            <label class="nexo-label" for="fStatus">Status</label>
                            <select id="fStatus" class="nexo-input"><option value="">Todos</option><option value="Ativo">Ativos</option><option value="Inativo">Inativos</option></select>
                        </div>
                        <div>
                            <label class="nexo-label" for="fUf">Estado (UF)</label>
                            <select id="fUf" class="nexo-input"><option value="">Todos</option></select>
                        </div>
                        <div>
                            <label class="nexo-label" for="fMarca">Marca</label>
                            <select id="fMarca" class="nexo-input"><option value="">Todas</option></select>
                        </div>
                    </div>
                </div>

                <!-- Métricas -->
                <div class="grid grid-cols-2 xl:grid-cols-4 gap-4">
                    <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-brand-border flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-brand-purpleLight text-brand-purple flex items-center justify-center shrink-0"><i class="fa-solid fa-truck"></i></div>
                        <div><p class="text-xs font-bold text-gray-500">Total de Fornecedores</p><p id="mTotal" class="text-2xl font-extrabold text-gray-900">0</p></div>
                    </div>
                    <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-brand-border flex items-center gap-4">
                        <div class="w-2.5 h-2.5 rounded-full bg-green-500 shrink-0"></div>
                        <div><p class="text-xs font-bold text-gray-500">Ativos</p><p id="mAtivos" class="text-2xl font-extrabold text-gray-900">0</p></div>
                    </div>
                    <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-brand-border flex items-center gap-4">
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></div>
                        <div><p class="text-xs font-bold text-gray-500">Inativos</p><p id="mInativos" class="text-2xl font-extrabold text-gray-900">0</p></div>
                    </div>
                    <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-brand-border flex items-center gap-4">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0"></div>
                        <div><p class="text-xs font-bold text-gray-500">Total comprado</p><p id="mComprado" class="text-2xl font-extrabold text-gray-900">R$ 0,00</p></div>
                    </div>
                </div>

                <!-- Lista -->
                <div class="bg-white rounded-2xl shadow-sm border border-brand-border overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs min-w-[1250px]">
                            <thead class="bg-gray-50 text-gray-500 border-b border-gray-100">
                                <tr>
                                    <th class="px-4 py-3 font-bold">Fornecedor</th>
                                    <th class="px-4 py-3 font-bold">CNPJ</th>
                                    <th class="px-4 py-3 font-bold">Contato</th>
                                    <th class="px-4 py-3 font-bold">Telefone</th>
                                    <th class="px-4 py-3 font-bold">Cidade/UF</th>
                                    <th class="px-4 py-3 font-bold">Marcas</th>
                                    <th class="px-4 py-3 font-bold text-center">Prazo</th>
                                    <th class="px-4 py-3 font-bold text-center">Produtos</th>
                                    <th class="px-4 py-3 font-bold text-right">Total comprado</th>
                                    <th class="px-4 py-3 font-bold text-center">Status</th>
                                    <th class="px-4 py-3 font-bold text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaFornecedores" class="divide-y divide-gray-100 font-medium text-gray-700"></tbody>
                        </table>
                    </div>
                    <div id="paginacao"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="../JS/fornecedores.js"></script>
</body>
</html>
