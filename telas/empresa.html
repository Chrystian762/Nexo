<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa - Nexo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../JS/nexo-tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../JS/nexo-data.js"></script>
    <script src="../JS/nexo-layout.js"></script>
</head>

<body class="bg-brand-bg text-brand-textMain h-screen overflow-hidden flex flex-col md:flex-row font-sans">

    <!-- Menu lateral montado por Nexo.layout.montar('empresa') -->
    <aside id="nexo-sidebar"></aside>

    <!-- CONTEÚDO PRINCIPAL (DADOS DA EMPRESA) -->
    <main class="flex-1 relative overflow-y-auto w-full h-full">
        <div class="max-w-[1200px] mx-auto p-4 md:p-8 w-full min-h-full pb-24 fade-in">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 mt-2 md:mt-0">
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-1">Dados da Empresa</h1>
                    <p class="text-sm md:text-base text-brand-textMuted">Visualize e edite as informações cadastrais e fiscais da sua empresa.</p>
                </div>

                <div class="flex flex-wrap gap-2">
                    <button type="button" id="btnEditar" class="bg-brand-purple hover:bg-purple-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-sm transition inline-flex items-center gap-2 justify-center">
                        <i class="fa-solid fa-pen"></i> Editar
                    </button>
                    <button type="button" id="btnCancelar" style="display:none" class="bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold px-6 py-2.5 rounded-xl shadow-sm transition items-center gap-2 justify-center">
                        <i class="fa-solid fa-xmark"></i> Cancelar
                    </button>
                    <button type="button" id="btnSalvar" style="display:none" class="bg-brand-purple hover:bg-purple-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-sm transition items-center gap-2 justify-center">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar alterações
                    </button>
                </div>
            </div>

            <!-- Resumo da empresa -->
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-brand-border mb-6 flex flex-col md:flex-row md:items-center gap-5">
                <div class="w-20 h-20 rounded-2xl bg-brand-purpleLight flex items-center justify-center shrink-0 p-2">
                    <img src="../assets/img/logoNexo.png" alt="Logo da empresa" class="max-w-full max-h-full object-contain">
                </div>
                <div class="min-w-0 flex-1">
                    <h2 id="resNome" class="text-xl font-extrabold text-gray-900 truncate"></h2>
                    <p id="resRazao" class="text-sm text-gray-500 truncate"></p>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 text-sm">
                    <div><p class="text-[11px] font-bold text-gray-500 uppercase">CNPJ</p><p id="resCnpj" class="font-semibold text-gray-900"></p></div>
                    <div><p class="text-[11px] font-bold text-gray-500 uppercase">Cidade/UF</p><p id="resCidade" class="font-semibold text-gray-900"></p></div>
                    <div><p class="text-[11px] font-bold text-gray-500 uppercase">Tempo de empresa</p><p id="resTempo" class="font-semibold text-gray-900"></p></div>
                    <div><p class="text-[11px] font-bold text-gray-500 uppercase">Última atualização</p><p id="resAtualizacao" class="font-semibold text-gray-900"></p></div>
                </div>
            </div>

            <form id="formEmpresa" novalidate class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-brand-border space-y-8">
                <div>
                    <h2 class="text-lg font-bold text-brand-purple mb-4 flex items-center gap-2"><i class="fa-solid fa-building"></i> Informações Cadastrais</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="nexo-label" for="f_razaoSocial">Razão Social</label>
                            <input type="text" id="f_razaoSocial" name="razaoSocial" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_nomeFantasia">Nome Fantasia</label>
                            <input type="text" id="f_nomeFantasia" name="nomeFantasia" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_cnpj">CNPJ</label>
                            <input type="text" id="f_cnpj" name="cnpj" class="nexo-input" inputmode="numeric" maxlength="18" readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_inscricaoEstadual">Inscrição Estadual</label>
                            <input type="text" id="f_inscricaoEstadual" name="inscricaoEstadual" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_inscricaoMunicipal">Inscrição Municipal</label>
                            <input type="text" id="f_inscricaoMunicipal" name="inscricaoMunicipal" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_regimeTributario">Regime Tributário</label>
                            <select id="f_regimeTributario" name="regimeTributario" class="nexo-input" disabled>
                                <option value="Simples Nacional">Simples Nacional</option>
                                <option value="Lucro Presumido">Lucro Presumido</option>
                                <option value="Lucro Real">Lucro Real</option>
                                <option value="MEI">MEI</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="nexo-label" for="f_cnae">CNAE (atividade principal)</label>
                            <input type="text" id="f_cnae" name="cnae" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_dataAbertura">Data de Abertura</label>
                            <input type="date" id="f_dataAbertura" name="dataAbertura" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_responsavel">Responsável</label>
                            <input type="text" id="f_responsavel" name="responsavel" class="nexo-input"  readonly>
                        </div>
                    </div>
                </div>

                <hr class="border-gray-100">

                <div>
                    <h2 class="text-lg font-bold text-brand-purple mb-4 flex items-center gap-2"><i class="fa-solid fa-address-book"></i> Dados de Contato</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="nexo-label" for="f_email">E-mail Principal</label>
                            <input type="email" id="f_email" name="email" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_emailFinanceiro">E-mail Financeiro</label>
                            <input type="email" id="f_emailFinanceiro" name="emailFinanceiro" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_telefone">Telefone</label>
                            <input type="tel" id="f_telefone" name="telefone" class="nexo-input" inputmode="tel" maxlength="15" readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_whatsapp">WhatsApp</label>
                            <input type="tel" id="f_whatsapp" name="whatsapp" class="nexo-input" inputmode="tel" maxlength="15" readonly>
                        </div>
                        <div class="md:col-span-2">
                            <label class="nexo-label" for="f_site">Site</label>
                            <input type="text" id="f_site" name="site" class="nexo-input"  readonly>
                        </div>
                    </div>
                </div>

                <hr class="border-gray-100">

                <div>
                    <h2 class="text-lg font-bold text-brand-purple mb-4 flex items-center gap-2"><i class="fa-solid fa-map-location-dot"></i> Endereço</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        <div>
                            <label class="nexo-label" for="f_cep">CEP</label>
                            <input type="text" id="f_cep" name="cep" class="nexo-input" inputmode="numeric" maxlength="9" readonly>
                            <p id="msgCep" class="text-xs text-gray-500 mt-1 hidden"></p>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="nexo-label" for="f_logradouro">Logradouro</label>
                            <input type="text" id="f_logradouro" name="logradouro" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_numero">Número</label>
                            <input type="text" id="f_numero" name="numero" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_complemento">Complemento</label>
                            <input type="text" id="f_complemento" name="complemento" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_bairro">Bairro</label>
                            <input type="text" id="f_bairro" name="bairro" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_cidade">Cidade</label>
                            <input type="text" id="f_cidade" name="cidade" class="nexo-input"  readonly>
                        </div>
                        <div>
                            <label class="nexo-label" for="f_uf">Estado (UF)</label>
                            <select id="f_uf" name="uf" class="nexo-input" disabled>
                                <option value="">Selecione</option>
                                <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                            </select>
                        </div>
                    </div>
                </div>
            </form>

        </div>
    </main>

    <script src="../JS/empresa.js"></script>
</body>

</html>
